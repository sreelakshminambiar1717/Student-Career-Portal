
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Career Portal - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            🎓 Student Career Portal
        </div>
    </header>


    <!-- Main Content -->
    <main class="login-page">

        <section class="login-card">

            <!-- Icon -->
            <div class="login-icon">
                🎓
            </div>

            <!-- Heading -->
            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to continue your career journey
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <!-- Register -->
            <div class="register-section">

                <span>
                    Don't have an account?
                </span>

                <a href="index.html">
                    Create an account
                </a>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        © 2026 Student Career Portal
    </footer>


    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
