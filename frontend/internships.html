
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Internships - Student Career Portal
    </title>

    <link
        rel="stylesheet"
        href="internships.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            🎓 Student Career Portal
        </div>

        <button
            id="backButton"
            type="button"
        >
            ← Dashboard
        </button>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="internship-container">


        <!-- HEADER -->

        <section class="page-header">

            <div>

                <p class="small-heading">
                    CAREER OPPORTUNITIES
                </p>

                <h1>
                    🎯 Internship Opportunities
                </h1>

                <p>
                    Find internships that help you
                    gain practical industry experience.
                </p>

            </div>

        </section>


        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-section">

            <input
                type="text"
                id="internshipSearch"
                placeholder="🔎 Search internships, companies, skills..."
            >

        </section>


        <!-- =========================
             INTERNSHIP LIST
        ========================== -->

        <section>

            <div
                id="internshipList"
                class="internship-grid"
            >

                <div class="loading">
                    ⏳ Loading internships...
                </div>

            </div>

        </section>


    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Student Career Portal

    </footer>


    <script src="internships.js"></script>

</body>

</html>
